#
# The Lighttpd config used by every Toolforge account in this repo. See README.md for usage.
#

##########
## Global rules
##  (must be before conditional blocks)
##########
# enable status pages
server.modules += ("mod_auth", "mod_status")
status.status-url = "/server-status"
status.statistics-url = "/server-statistics"

# enable access log
# %t = end timestamp
# %r = request line (e.g. "GET /url HTTP/1.1")
# %s = HTTP response status code
# %b = HTTP response byte size
# %D = time spent (in microseconds)
# %{Referer}i = the page which linked to this URL, if any
# %{User-Agent}i = the `User-Agent` header provided by the client
accesslog.filename = env.HOME + "/logs/access.log"
accesslog.format = "%t \"%r\" %s %b %D \"%{Referer}i\" \"%{User-Agent}i\""

# disable %2F being treated as a path separator
# By default, Lighttpd decodes '%2F' into '/' *before* the request path is resolved. Since forms are submitted or
# redirected to routes, that can result in submitted values silently getting truncated or split (e.g.
# `/lookup/212.75.0.1%2F16` being treated as separate '212.75.0.1' and '16' route values).
server.http-parseopts += ("url-path-2f-decode" => "disable")


##########
## meta (user scripts + most tools)
##########
$HTTP["host"] =~ "^meta\." {
    url.redirect += (
        # redirect to other tool accounts
        "^/(crossactivity)(.*)$" => "https://meta2.toolforge.org/$1$2",
        "^/(stalktoy)(.*)$" => "https://meta3.toolforge.org/$1$2",

        # redirect root
        "^/?$" => "/accounteligibility/",

        # prettify generated tool URLs that have a route version
        "^/accounteligibility(?:/index.php|/)?\?user=([^&]+)&(?:(wiki=[^&]+)|wiki=)&event=(\d+)$" => "/accounteligibility/$3/$1?$2",
        "^/stewardry(?:/index.php|/)?\?wiki=([^&]+)&?(.*)$" => "/stewardry/$1?$2",
        "^/userpages(?:/index.php|/)?\?user=([^&]+)$" => "/userpages/$1",

        # scripts to static server
        "^/scripts/(.*)$" => "https://tools-static.wmflabs.org/meta/scripts/$1"
    )

    # convert route value into query string
    url.rewrite-if-not-file += (
        "^/(accounteligibility|gusersearch|stewardry|userpages)(/[^\?]+)(?:\?(.*))?$" => "/$1/index.php?$3&@route=$2"
    )
}


##########
## meta2 (crossactivity)
##########
$HTTP["host"] =~ "^meta2\." {
    url.redirect += (
        # redirect to other tool accounts
        "^/(accounteligibility|catanalysis|globalgroups|gusersearch|magicredirect|scripts|stewardry|userpages)(.*)$" => "https://meta.toolforge.org/$1$2",
        "^/(stalktoy)(.*)$" => "https://meta3.toolforge.org/$1$2",

        # redirect root
        "^/?$" => "/crossactivity/",

        # prettify generated tool URLs that have a route version
        "^/crossactivity(?:/index.php|/)?\?user=([^&]+)$" => "/crossactivity/$1"
    )

    # rewrite pretty URLs (e.g. /tool/a/b/c => /tool/index.php?@route=/a/b/c)
    url.rewrite-if-not-file += (
        "^/crossactivity(/[^\?]*+)(?:\?(.*))?$" => "/crossactivity/index.php?$2&@route=$1"
    )
}


##########
## meta3 (stalktoy)
##########
$HTTP["host"] =~ "^meta3\." {
    url.redirect += (
        # redirect to other tool accounts
        "^/(accounteligibility|catanalysis|globalgroups|gusersearch|magicredirect|scripts|stewardry|userpages)(.*)$" => "https://meta.toolforge.org/$1$2",
        "^/(crossactivity)(.*)$" => "https://meta2.toolforge.org/$1$2",

        # redirect root
        "^/?$" => "/stalktoy/",

        # prettify generated tool URLs that have a route version
        "^/stalktoy(?:/index.php|/)?\?target=([^&]+)$" => "/stalktoy/$1"
    )

    # rewrite pretty URLs (e.g. /tool/a/b/c => /tool/index.php?@route=/a/b/c)
    url.rewrite-if-not-file += (
        "^/stalktoy(/[^\?]+)(?:\?(.*))?$" => "/stalktoy/index.php?$2&@route=$1"
    )
}


##########
## crossactivity (legacy account)
##########
$HTTP["host"] =~ "^crossactivity\." {
    # redirect to the main account
    url.redirect += (
        "^(?:/crossactivity)?(.*)$" => "https://meta.toolforge.org/crossactivity$1"
    )
}
