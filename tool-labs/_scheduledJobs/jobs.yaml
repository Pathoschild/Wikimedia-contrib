#
# The scheduled jobs registered for a tool account. See README.md for usage.
#
# Implementation notes:
#   - The mariadb image is used by the log rotation job because the other images don't have
#     logrotate, and by the other jobs just for consistency.
#   - Continuous jobs trigger onfailure emails by default when restarted for a deploy. To avoid
#     that, run their command with `exec` so they run in the container's main process and can handle
#     the SIGINT/SIGTERM signals in their code.
#

# continuous: maintain a `server-load.json` file for automatic deferral (see README)
- name: track-server-load
  command: exec bash $HOME/git/wikimedia-contrib/tool-labs/_scheduledJobs/track-server-load.sh
  image: mariadb
  continuous: true
  emails: onfailure

  # Log output just in case (to a different file path), but the task appends its output to
  # `logs/job-track-server-load.log` manually to allow for log rotation.
  filelog-stdout: logs/default-job-track-server-load.log
  filelog-stderr: logs/default-job-track-server-load.err

# daily: rotate logs into ~/logs/old, with one week of backups
- name: rotate-logs
  command: logrotate -v $HOME/git/wikimedia-contrib/tool-labs/_scheduledJobs/logrotate.conf --state $HOME/logrotate.state
  image: mariadb
  schedule: "@daily"
  emails: onfailure
  filelog-stdout: logs/job-rotate-logs.log # relative to the tool's home directory
  filelog-stderr: logs/job-rotate-logs.err

# daily: send an email summary of any new messages in `error.log`
- name: report-errors
  command: bash $HOME/git/wikimedia-contrib/tool-labs/_scheduledJobs/report-errors.sh
  image: mariadb
  schedule: "@daily"
  emails: onfailure
  filelog-stdout: logs/job-report-errors.log
  filelog-stderr: logs/job-report-errors.err
